name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (for pinned pnpm version)
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies (full workspace)
        run: pnpm install --frozen-lockfile

      - name: Build and package MyDay as .dmg
        run: pnpm --filter @workspace/myday run package:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDay-dmg
          path: artifacts/myday/release/*.dmg
